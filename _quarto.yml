project:
  execute-dir: project
  output-dir: _output
  preview:    
    # host: 0.0.0.0
    # port: 4200
    browser: false
  pre-render: ./quarto-utils/_utils/pre-render.sh 

language: 
  title-block-author-single: "Auteur"

execute:
  echo: false
  output: false
  error: false
  warning: true
  freeze: auto  # re-render only when source changes
  cache: true
  timeout: 60

lang: fr
author:
    - name: "Emmanuel BRUNO"
      email: "emmanuel.bruno@univ-tln.fr"
      url: "https://bruno.univ-tln.fr"
institute: 
    - Université de Toulon
    - LIS UMR CNRS 7020
affiliations:
    - name: Université de Toulon
    - name: LIS UMR CNRS 7020
date: last-modified
date-format: iso
license: "CC BY-NC"

profile:
  default: notes
  group: 
    - [notes, slides]

resources:
  - quarto-utils/_assets

metadata-files:
  - quarto-utils/_website.yml
#  - quarto-utils/_format.yml

filters:
   - quarto
   - include-code-files
   - line-highlight
   - lua-env
   - add-code-files
   - code-fullscreen
   - roughnotation
   - code-visibility
   - auto-dark
   - github