project:
  execute-dir: project
  preview:    
    browser: false

  pre-render: ./quarto-utils/_utils/pre-render.sh 
  resources:
    resources
  render:
    - "index.qmd" 
    - "*.ipynb" 
    - "*.qmd" 
    - "!HIDDEN"
    
language: 
  title-block-author-single: "Auteur"

execute:
  echo: false
  output: false
  error: false
  warning: true
  #freeze: auto  # re-render only when source changes
  cache: true
  timeout: 60

lang: fr
author:
    - name: "Emmanuel BRUNO"
      email: "emmanuel.bruno@univ-tln.fr"
      url: "https://bruno.univ-tln.fr"
institute: 
    - Université de Toulon
    - LIS UMR CNRS 7020
affiliations:
    - name: Université de Toulon
    - name: LIS UMR CNRS 7020
date: last-modified
date-format: iso
license: "CC BY-NC"

profile:
  default: slides
  group: 
    - [notes, slides]

resources:
  - quarto-utils/_assets

metadata-files:
  - quarto-utils/_website.yml
#  - quarto-utils/_format.yml

filters:
   - quarto
   - include-code-files
   - line-highlight
   - lua-env
   - add-code-files
   - code-fullscreen
   - roughnotation
   - code-visibility
   - auto-dark
   - github

format:
  html: 
    css: quarto-utils/custom.css 
    include-in-header:
      text: |
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">    

website: 
  site-url: "https://bruno.univ-tln.fr"